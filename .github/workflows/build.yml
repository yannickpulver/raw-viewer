name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # The toolbar uses macOS 26 APIs behind `#available`, so the build needs the 26 SDK.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Install Tuist
        run: |
          brew tap tuist/tuist
          brew trust tuist/tuist
          brew install --formula tuist

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Generate project
        working-directory: mac
        run: tuist generate --no-open

      - name: Test
        working-directory: mac
        run: |
          xcodebuild -project RAWViewer.xcodeproj -scheme RAWViewer \
            -derivedDataPath build test

      - name: Build app
        working-directory: mac
        run: |
          xcodebuild -project RAWViewer.xcodeproj -scheme RAWViewer -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build
          # The Xcode product is RAWViewer.app; the cask and the zip ship "RAW Viewer.app".
          mkdir -p ../dist
          ditto build/Build/Products/Release/RAWViewer.app "../dist/RAW Viewer.app"

      - name: Import certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm certificate.p12

      - name: Sign app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="dist/RAW Viewer.app"
          IDENTITY="Developer ID Application: Yannick Pulver ($APPLE_TEAM_ID)"
          SIGN=(codesign --force --options runtime --timestamp --sign "$IDENTITY")
          # Sparkle's helpers are signed inside-out before the framework and the app.
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          "${SIGN[@]}" "$SPARKLE/Versions/B/XPCServices/Installer.xpc"
          "${SIGN[@]}" --preserve-metadata=entitlements "$SPARKLE/Versions/B/XPCServices/Downloader.xpc"
          "${SIGN[@]}" "$SPARKLE/Versions/B/Autoupdate"
          "${SIGN[@]}" "$SPARKLE/Versions/B/Updater.app"
          "${SIGN[@]}" "$SPARKLE"
          "${SIGN[@]}" "$APP"
          codesign --verify --deep --strict "$APP"
          echo "Signing verified successfully"

      - name: Zip app bundle
        run: |
          ditto -c -k --keepParent "dist/RAW Viewer.app" "dist/RAW-Viewer.zip"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          OUTPUT=$(xcrun notarytool submit "dist/RAW-Viewer.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait 2>&1)
          echo "$OUTPUT"
          # Extract submission ID and fetch log on failure
          SUBMISSION_ID=$(echo "$OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
          if echo "$OUTPUT" | grep -q "status: Invalid"; then
            echo "Notarization failed! Fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "status: Accepted"; then
            echo "Notarization did not succeed. Status unknown."
            exit 1
          fi

      - name: Staple app
        run: xcrun stapler staple "dist/RAW Viewer.app"

      - name: Re-zip after stapling
        run: |
          rm dist/RAW-Viewer.zip
          ditto -c -k --keepParent "dist/RAW Viewer.app" "dist/RAW-Viewer.zip"

      - name: Write appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          # One item per feed: the app reads it from `releases/latest/download/appcast.xml`.
          SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" \
            | mac/build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - dist/RAW-Viewer.zip)
          REPO="https://github.com/${{ github.repository }}"
          cat > dist/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>RAW Viewer</title>
              <item>
                <title>$VERSION</title>
                <sparkle:version>$BUILD</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>$REPO/releases/tag/v$VERSION</sparkle:fullReleaseNotesLink>
                <enclosure url="$REPO/releases/download/v$VERSION/RAW-Viewer.zip" $SIGNATURE type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF
          cat dist/appcast.xml

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: RAW Viewer ${{ steps.version.outputs.version }}
          files: |
            dist/RAW-Viewer.zip
            dist/appcast.xml
          generate_release_notes: true

  update-homebrew:
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/update-homebrew-tap.yml
    with:
      tag: v${{ needs.build.outputs.version }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
